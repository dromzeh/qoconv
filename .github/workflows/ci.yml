name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  # The Wails GUI only compiles with its "production" tag; Windows needs no
  # CGO for it, so this is the cheapest place to keep it building.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: vet (GUI build)
        run: go vet -tags production ./...
      - name: build (GUI)
        run: go build -tags production -o qoconv.exe ./cmd/qoconv
