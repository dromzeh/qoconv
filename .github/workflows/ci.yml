name: CI

# Docs-only changes (README, licence, funding links) can't break the build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.github/FUNDING.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  # The Wails GUI only compiles with its "production" tag; Windows needs no
  # CGO for it, so this is the cheapest place to keep it building.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
      - name: vet (GUI build)
        run: go vet -tags production ./...
      - name: build (GUI)
        run: go build -tags production -o qoconv.exe ./cmd/qoconv
