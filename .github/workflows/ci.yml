name: CI

# Docs-only changes (README, licence, funding links) can't break the build.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/FUNDING.yml']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.github/FUNDING.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  # The Wails GUI only compiles with its "production" tag; Windows needs no
  # CGO for it, so this is the cheapest place to keep it building.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: vet (GUI build)
        run: go vet -tags production ./...
      - name: build (GUI)
        run: go build -tags production -o qoconv.exe ./cmd/qoconv
