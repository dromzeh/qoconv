<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qoconv</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="titlebar">
    <span class="title"><img src="logos/qoconv.svg" alt=""><span id="title">qoconv</span></span>
    <div class="window-controls">
      <button type="button" id="win-min" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
      <button type="button" id="win-close" class="close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7m0-7-7 7"/></svg></button>
    </div>
  </header>

  <div class="banner-wrap">
    <button type="button" class="banner" id="banner" aria-haspopup="listbox" aria-expanded="false">
      <span class="banner-art" id="banner-art"></span>
      <span class="banner-empty" id="banner-empty">
        <b>Drop a skin here</b>
        <span>or click to pick one of your osu! or Quaver skins</span>
      </span>
      <span class="banner-skin" id="banner-skin" hidden>
        <span class="skin-name" id="skin-name"></span>
        <span class="skin-author" id="skin-author"></span>
      </span>
      <span class="badge" id="direction" hidden></span>
      <span class="change" id="change" hidden>Change skin <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5"/></svg></span>
    </button>

    <div class="picker" id="picker" hidden>
      <input type="search" id="picker-search" placeholder="Search skins" spellcheck="false" autocomplete="off" aria-controls="picker-list">
      <ul class="picker-list" id="picker-list" role="listbox" aria-label="Installed skins"></ul>
      <div class="picker-foot">
        <button type="button" id="browse-file">Browse for a file…</button>
        <button type="button" id="browse-folder">Browse for a folder…</button>
      </div>
    </div>
  </div>

  <main class="body">
    <div class="preview" id="preview-box">
      <div class="screen" id="screen" role="img" aria-label="Playfield preview"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="seg" role="tablist" aria-label="Section">
          <button type="button" role="tab" id="tab-layout" aria-selected="true">Layout</button>
          <button type="button" role="tab" id="tab-output" aria-selected="false">Output</button>
        </div>
        <div class="head-right">
          <button type="button" class="text-btn" id="reset-all" hidden>Reset all</button>
          <div class="seg" role="tablist" aria-label="Keymode" id="mode-tabs"></div>
        </div>
      </div>

      <div class="rows" id="pane-layout"></div>

      <div class="output" id="pane-output" hidden>
        <div class="pair">
          <label>Name <input id="in-name" type="text" spellcheck="false" autocomplete="off"></label>
          <label>Author <input id="in-author" type="text" spellcheck="false" autocomplete="off"></label>
        </div>
        <label class="folder">Save to
          <span class="folder-row">
            <input id="in-output" type="text" spellcheck="false">
            <button type="button" class="small" id="pick-output" aria-label="Choose folder">…</button>
          </span>
        </label>
        <div class="checks">
          <label><input type="checkbox" id="in-archive" checked> <span id="archive-label">Make archive</span></label>
          <label><input type="checkbox" id="in-install" checked> <span id="install-label">Install when done</span></label>
          <label><input type="checkbox" id="in-grades" checked> Grades</label>
          <label><input type="checkbox" id="in-hitsounds" checked> Hitsounds</label>
          <label title="Turn off if the health bar comes out upside down"><input type="checkbox" id="in-healthcw" checked> Health bar CW</label>
          <span class="modes" id="mode-checks"></span>
        </div>
        <ul class="notes" id="notes"></ul>
      </div>
    </div>
  </main>

  <footer class="actions">
    <div class="foot-left">
      <div class="socials">
        <a href="https://github.com/dromzeh/qoconv" title="qoconv on GitHub" aria-label="qoconv on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </a>
        <a href="https://x.com/dromzeh" title="@dromzeh on Twitter" aria-label="@dromzeh on Twitter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.543 7.104c.015.211.015.423.015.636 0 6.507-4.954 14.01-14.01 14.01v-.003A13.94 13.94 0 0 1 0 19.539a9.88 9.88 0 0 0 7.287-2.041 4.93 4.93 0 0 1-4.6-3.42 4.916 4.916 0 0 0 2.223-.084A4.926 4.926 0 0 1 .96 9.167v-.062a4.887 4.887 0 0 0 2.235.616A4.928 4.928 0 0 1 1.67 3.148 13.98 13.98 0 0 0 11.82 8.292a4.929 4.929 0 0 1 8.39-4.49 9.868 9.868 0 0 0 3.128-1.196 4.941 4.941 0 0 1-2.165 2.724A9.828 9.828 0 0 0 24 4.555a10.019 10.019 0 0 1-2.457 2.549z"/></svg>
        </a>
      </div>
      <p class="status" id="status" role="status" hidden></p>
      <p class="made" id="made">Made with <svg class="heart" viewBox="0 0 24 24" aria-label="love"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> by <a href="https://dromzeh.dev" title="dromzeh.dev">dromzeh</a></p>
    </div>
    <button type="button" class="convert" id="convert" title="Ctrl+Enter" disabled>
      <span class="tri tri-far" aria-hidden="true"></span>
      <span class="tri tri-near" aria-hidden="true"></span>
      <img class="q-mark" src="logos/quaver.svg" alt="" aria-hidden="true">
      <span class="shine" aria-hidden="true"></span>
      <img class="convert-logo" id="convert-logo" alt="" hidden>
      <span class="convert-label" id="convert-label">Convert</span>
    </button>
  </footer>
</body>
</html>
